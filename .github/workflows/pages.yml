# Publica a aplicação estática no GitHub Pages.
#
# Não há servidor: o `next build` com `output: "export"` gera HTML e JS, e o
# navegador fala direto com a api.openai.com. O `BASE_PATH` existe porque no
# Pages o site mora em /cardios-bot-atendimento-voz e não na raiz do domínio.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /cardios-bot-atendimento-voz
      # No Pages o site mora numa subpasta. Caminho absoluto sem o basePath
      # funciona local e vira 404 em produção, que foi como o logo quebrou.
      - run: node scripts/verificar-caminhos.mjs out /cardios-bot-atendimento-voz
      # Sem isto o Pages engole tudo que começa com underscore, e o Next
      # publica os assets em _next.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
